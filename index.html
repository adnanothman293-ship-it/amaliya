<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F2; --card:#FFFFFF; --ink:#0F2A2E; --muted:#5F7577; --line:#D5E0DE;
  --scrub:#2B6F6A; --deep:#123F3D; --mint:#DCEEEA;
  --danger:#A8322D; --ok:#2E7D5B;
  --c0:#6C8AA6; --c1:#2B8C82; --c2:#C98A1B; --c3:#A8322D;
  --head:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- login ---------- */
.auth{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px 20px;padding-top:calc(24px + env(safe-area-inset-top))}
.auth>*{width:100%;max-width:440px}
.lock{text-align:center}.lock .lock-ico{width:68px;height:68px;margin:4px auto 12px;border-radius:20px;background:var(--mint);color:var(--deep);display:flex;align-items:center;justify-content:center}.lock .lock-ico svg{width:38px;height:38px}
.brand{color:var(--deep);margin-bottom:28px}
.brand h1{font-family:var(--head);font-weight:700;font-size:56px;line-height:1;letter-spacing:-1px}
.brand svg{display:block;width:160px;height:36px;margin-top:6px}
.brand p{color:var(--muted);margin-top:8px}
.auth-card{background:var(--card);border-radius:14px;padding:22px;border:1px solid var(--line);max-width:440px;width:100%}
.auth-card h2{font-family:var(--head);font-size:20px;margin-bottom:16px}
.link{background:none;border:0;color:var(--scrub);font-weight:600;padding:8px 0;cursor:pointer}

/* ---------- form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:#FAFCFC;border-radius:10px;padding:12px 13px;font-size:16px;outline:none;transition:border-color .15s}
.field textarea{min-height:84px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--scrub);background:#fff}
.field .ro{background:var(--mint);border-color:transparent;font-weight:600}
.ltr{direction:ltr;text-align:left}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;font-weight:500;margin-bottom:14px}
.check input{width:20px;height:20px;accent-color:var(--scrub)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:13px 18px;font-weight:600;cursor:pointer;background:var(--scrub);color:#fff;font-size:15px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--scrub);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid #EBCFCD}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:8px}
:focus-visible{outline:2px solid var(--scrub);outline-offset:2px}

/* ---------- shell ---------- */
.top{background:var(--deep);color:#fff;padding:14px 18px 0;padding-top:calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:20}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top-brand{font-family:var(--head);font-weight:700;font-size:24px;line-height:1;display:flex;align-items:center;gap:8px}
.top-brand svg{width:54px;height:18px}
.who{text-align:left;font-size:12.5px;line-height:1.35;opacity:.9}
.who b{display:block;font-size:14px;opacity:1}
.out{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;cursor:pointer;margin-inline-start:8px}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:rgba(255,255,255,.7);padding:10px 10px 12px;font-weight:600;white-space:nowrap;cursor:pointer;border-bottom:3px solid transparent;font-size:14.5px}
.tab.on{color:#fff;border-bottom-color:#7FD1C4}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:4px;border-radius:10px;background:#7FD1C4;color:var(--deep);font-size:12px;line-height:20px;text-align:center}
main{padding:18px 16px 40px;max-width:1180px;margin:0 auto}
.top-inner{max-width:1180px;margin:0 auto}
.me{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;cursor:pointer;padding:4px;border-radius:12px}
.me:active{background:rgba(255,255,255,.08)}
.me-av{width:38px;height:38px;border-radius:50%;background:rgba(127,209,196,.18);color:#BFEDE5;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700;font-size:16px;flex:none}
#bioTip{padding:0 16px;max-width:1180px;margin:0 auto}
.tip{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #B9D9D2;border-radius:14px;padding:12px 12px 12px 8px;margin-top:14px}
.tip-ico{width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--deep);display:flex;align-items:center;justify-content:center;flex:none}
.tip-ico svg{width:24px;height:24px}
.tip>div{flex:1;line-height:1.35}.tip small{display:block;color:var(--muted);font-size:12.5px}
.set-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.set-row>div{flex:1;line-height:1.4}.set-row small{display:block;color:var(--muted);font-size:12.5px}
#printHead{display:none}
.split>*{min-width:0}
@media (min-width:760px){
  main{padding:24px 24px 56px}
  #bioTip{padding:0 24px}
  .top{padding-left:24px;padding-right:24px}
  .split{display:grid;grid-template-columns:minmax(320px,390px) 1fr;gap:20px;align-items:start}
  .split .panel{position:sticky;top:130px}
  .rep-controls{display:grid;grid-template-columns:minmax(300px,1.3fr) repeat(3,1fr);gap:12px;align-items:end}
  .rep-controls .seg{margin-bottom:14px}
  .rep-controls .row2{display:contents}
  .dt td{padding:13px 14px}
  .dt th{padding:12px 14px}
  .cats{gap:12px}
  .cats b{font-size:26px}
}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}.tab:hover{color:#fff}}
.h{font-family:var(--head);font-size:20px;font-weight:600;margin-bottom:4px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.empty{text-align:center;color:var(--muted);padding:34px 16px;border:1.5px dashed var(--line);border-radius:14px}
.empty b{display:block;color:var(--ink);font-family:var(--head);font-size:16px;margin-bottom:4px}

/* ---------- severity meter (signature) ---------- */
.sev{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap}
.sev i{display:inline-flex;gap:2px}
.sev i span{width:7px;height:16px;border-radius:2px;background:#DCE5E4}
.sev.k0 i span:nth-child(-n+1){background:var(--c0)} .sev.k0{color:var(--c0)}
.sev.k1 i span:nth-child(-n+2){background:var(--c1)} .sev.k1{color:var(--c1)}
.sev.k2 i span:nth-child(-n+3){background:var(--c2)} .sev.k2{color:var(--c2)}
.sev.k3 i span:nth-child(-n+4){background:var(--c3)} .sev.k3{color:var(--c3)}

/* ---------- op card ---------- */
.op{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.op.is-pending{border-color:#B9D9D2;box-shadow:inset 4px 0 0 #7FD1C4}
.op-head{display:flex;gap:12px;align-items:center;padding:14px 16px}
.op-table{min-width:62px;text-align:center;background:var(--mint);border-radius:10px;padding:6px 8px;line-height:1.2}
.op-table small{display:block;font-size:10.5px;color:var(--muted)}
.op-table b{font-family:var(--head);font-size:19px;color:var(--deep)}
.op-main{flex:1;min-width:0}
.op-main h3{font-family:var(--head);font-size:16.5px;font-weight:600;line-height:1.35}
.op-sub{color:var(--muted);font-size:13.5px}
.wait{font-size:12.5px;font-weight:600;color:var(--scrub);background:var(--mint);padding:4px 10px;border-radius:20px;white-space:nowrap}
.op-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:12px 16px;border-top:1px solid var(--line)}
.op-grid dt{font-size:12px;color:var(--muted)}
.op-grid dd{font-weight:500;font-size:14.5px}
.op-notes{padding:10px 16px 14px;font-size:14px;border-top:1px solid var(--line);white-space:pre-wrap}
.op-notes small{display:block;font-size:12px;color:var(--muted)}
.op-meta{padding:0 16px 12px;color:var(--muted);font-size:12.5px}
.op-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}

/* ---------- reports ---------- */
.seg{display:flex;background:#DDE7E5;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--deep);box-shadow:0 1px 2px rgba(15,42,46,.12)}
.range{font-family:var(--head);font-size:15px;color:var(--deep);margin:4px 0 14px}
.total{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.total b{font-family:var(--head);font-size:44px;line-height:1;color:var(--deep)}
.total span{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.cats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
.cats b{display:block;font-family:var(--head);font-size:22px}
.cats small{font-size:12px;color:var(--muted)}
.cats .k0 b{color:var(--c0)} .cats .k1 b{color:var(--c1)} .cats .k2 b{color:var(--c2)} .cats .k3 b{color:var(--c3)}
.bydoc{margin-bottom:16px}
.bydoc div{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.bydoc b{font-family:var(--head)}
.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:13.5px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#F3F7F6;font-weight:600;color:var(--muted);font-size:12.5px;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:16px 0 10px}

/* ---------- users ---------- */
.user{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.user:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--mint);color:var(--deep);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:700}
.user .info{flex:1;min-width:0}
.user .info b{display:block}
.user .info small{color:var(--muted);direction:ltr;display:block;text-align:right;overflow:hidden;text-overflow:ellipsis}
.role{font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;background:#E6EEED;color:var(--deep);white-space:nowrap}


/* ---------- data table ---------- */
.dt{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 2px rgba(15,42,46,.04),0 8px 24px -16px rgba(15,42,46,.25)}
.dt-head{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dt-title{font-family:var(--head);font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:8px}
.dt-count{font-family:var(--head);font-size:12px;background:var(--mint);color:var(--deep);border-radius:20px;padding:1px 10px}
.dt-tools{display:flex;gap:8px;align-items:center;flex:1;justify-content:flex-end;min-width:220px}
.dt-tools .btn svg{flex:none}
.dt-search{flex:1;min-width:120px;max-width:300px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:15px;background:#FAFCFC;outline:none}
.dt-search:focus{border-color:var(--scrub);background:#fff}
.dt-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.dt table{min-width:0;width:100%;font-size:14px}
.dt th{position:relative;background:#F4F8F7;font-size:12px;letter-spacing:.2px;padding:11px 12px;border-bottom:1px solid var(--line);user-select:none}
.dt th.srt{cursor:pointer}
.dt th.on{color:var(--deep)}
.dt th .arr{margin-inline-start:4px;color:var(--scrub);font-weight:700}
.dt td{padding:12px;background:#fff;border-bottom:1px solid #EAF0EF;vertical-align:middle;transition:background .12s}
.dt tbody tr{cursor:pointer}
.dt tbody tr:nth-child(even) td{background:#FAFCFC}
.dt tbody tr:active td,.dt tbody tr:hover td{background:#EEF6F4}
.dt .stick{position:sticky;right:0;z-index:2;box-shadow:-1px 0 0 var(--line)}
.dt th.stick{z-index:3}
.dt .nw{white-space:nowrap}
.dt .dim{color:var(--muted);font-size:13px}
.dt .strong{font-weight:600;min-width:140px}
.dt .notes{min-width:180px;max-width:260px;color:var(--muted);font-size:13px}
.dt .pp{min-width:96px}
.dt tbody{counter-reset:r}.dt tbody tr{counter-increment:r}
.patient .av{background:#fff;flex:none}
.dt .num{font-family:var(--head);color:var(--muted);font-size:12.5px}
.dt .na{color:#B7C4C2}
.pname{min-width:120px;line-height:1.3}
.pname b{display:block;font-weight:600;font-size:14.5px}
.pname small{color:var(--muted);font-size:12px}
.st{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px}
.st.done{background:#E3F2EC;color:var(--ok)}
.st.wait{background:#E6F4F1;color:var(--scrub);box-shadow:inset 0 0 0 1px #B9D9D2}
.dt-empty{text-align:center;color:var(--muted);padding:34px 16px}
.dt-empty b{display:block;color:var(--ink);font-family:var(--head);font-size:15.5px;margin-bottom:4px}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:6px 0 12px}
.hero-l{font-family:var(--head);font-size:14px;color:var(--scrub)}
.hero .total{margin:2px 0 0}
.cats div{position:relative;overflow:hidden}
.cats i{position:absolute;bottom:0;right:0;height:3px;border-radius:2px;transition:width .3s}
.cats .k0 i{background:var(--c0)} .cats .k1 i{background:var(--c1)} .cats .k2 i{background:var(--c2)} .cats .k3 i{background:var(--c3)}
.op-grid.flat,.op-notes.flat{border-top:0;padding:0 0 12px}
.op-notes.flat{background:#F4F8F7;border-radius:10px;padding:10px 12px}
.sheet-actions{display:grid;gap:8px;margin-top:6px}
@media print{.dt{box-shadow:none;border:0}.dt-head .dt-search{display:none}.dt-scroll{overflow:visible}.dt .stick{position:static;box-shadow:none}.dt td{padding:6px}}

/* ---------- print sheet ---------- */
.dt-hint{font-size:12px;color:var(--scrub);background:#F1F8F6;padding:6px 14px;border-bottom:1px solid var(--line)}
.psheet{position:fixed;inset:0;z-index:70;background:#5E6E70;display:flex;flex-direction:column}
.ps-bar{display:flex;align-items:center;gap:12px;background:var(--deep);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));flex-wrap:wrap}
.ps-bar .x{background:rgba(255,255,255,.14);color:#fff}
.ps-bar-t{flex:1;min-width:120px;line-height:1.3}.ps-bar-t small{display:block;opacity:.75;font-size:12px}.ps-bar-t b{font-family:var(--head)}
.ps-actions{display:flex;gap:8px;flex-wrap:wrap}
.ps-actions .btn{background:#fff;color:var(--deep)}
.ps-actions .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.ps-actions .btn.ready{background:#7FD1C4;color:var(--deep);border-color:transparent}
.ps-scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.ps-wrap{margin:0 auto;position:relative}
.ps-doc{width:1123px;transform-origin:top right;position:absolute;top:0;right:0}
.ps-page,.ps-capture .ps-page{width:1123px;height:794px;background:#fff;color:#0F2A2E;padding:26px 30px 20px;display:flex;flex-direction:column;margin-bottom:16px;box-shadow:0 6px 24px rgba(0,0,0,.25);overflow:hidden;font-family:var(--body);letter-spacing:0;direction:rtl}
.ps-capture{position:fixed;top:0;left:0;width:1123px;z-index:69;pointer-events:none}
.ps-capture .ps-page{box-shadow:none;margin:0}
.ps-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-bottom:12px;border-bottom:2.5px solid #123F3D}
.ps-brand{display:flex;align-items:center;gap:10px}
.ps-logo{width:46px;height:46px;border-radius:12px;display:block}
.ps-logo svg{width:34px;height:12px}
.ps-brand b{display:block;font-family:var(--head);font-size:24px;line-height:1.05;color:#123F3D}
.ps-brand small,.ps-meta small{display:block;color:#5F7577;font-size:11.5px;line-height:1.5}
.ps-title{text-align:center}.ps-title b{display:block;font-family:var(--head);font-size:19px;color:#123F3D}.ps-title small{color:#2B6F6A;font-size:12.5px;font-weight:600}
.ps-meta{text-align:left}
.ps-sum{display:flex;gap:10px;align-items:stretch;margin:12px 0 4px;flex-wrap:wrap}
.ps-tot{background:#123F3D;color:#fff;border-radius:10px;padding:8px 18px;display:flex;align-items:baseline;gap:8px}
.ps-tot b{font-family:var(--head);font-size:28px;line-height:1}.ps-tot span{font-size:12.5px;opacity:.85}
.ps-k{border:1.5px solid #D5E0DE;border-radius:10px;padding:6px 14px;text-align:center;min-width:86px;line-height:1.25}
.ps-k b{display:block;font-family:var(--head);font-size:20px}.ps-k span{font-size:11.5px;color:#5F7577}
.ps-k.k0 b{color:#6C8AA6}.ps-k.k1 b{color:#2B8C82}.ps-k.k2 b{color:#C98A1B}.ps-k.k3 b{color:#A8322D}
.ps-docs{flex:1;display:flex;flex-wrap:wrap;gap:6px 14px;align-content:center;font-size:12px;color:#5F7577;border-inline-start:1.5px solid #D5E0DE;padding-inline-start:14px}
.ps-docs b{color:#123F3D;font-family:var(--head)}
.ps-t{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:12px;font-size:11.5px}
.ps-t th{background:#123F3D;color:#fff;font-weight:600;font-size:11px;padding:8px 6px;text-align:right;border:0;white-space:nowrap;overflow:hidden}
.ps-t td{padding:6px;border-bottom:1px solid #E1E9E7;vertical-align:middle;text-align:right;background:#fff}
.ps-t tbody tr:nth-child(even) td{background:#F5F9F8}
.ps-t td>div{max-height:31px;overflow:hidden;line-height:15.5px;word-break:break-word}
.ps-t td b{font-weight:600}
.ps-t .na{color:#B7C4C2}
.ps-cat{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10.5px;font-weight:600;color:#fff;white-space:nowrap}
.ps-cat.k0{background:#6C8AA6}.ps-cat.k1{background:#2B8C82}.ps-cat.k2{background:#C98A1B}.ps-cat.k3{background:#A8322D}
.ps-st{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10.5px;font-weight:600;white-space:nowrap}
.ps-st.ok{background:#E3F2EC;color:#2E7D5B}.ps-st.w{background:#E6F4F1;color:#2B6F6A}
.ps-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-top:10px;border-top:1px solid #D5E0DE;font-size:11.5px;color:#5F7577}
.ps-sign{display:flex;gap:34px;color:#0F2A2E;font-size:12px}
@media print{
  body.ps-open>*:not(#printSheet){display:none!important}
  body.ps-open #printSheet{position:static;background:#fff;display:block}
  body.ps-open .ps-bar{display:none!important}

</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, onSnapshot, serverTimestamp, Timestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAq12bvUArmc5GxD1Yj9lS0-JtwK1Fzf2U",
  authDomain: "amaliya-12d92.firebaseapp.com",
  projectId: "amaliya-12d92",
  storageBucket: "amaliya-12d92.firebasestorage.app",
  messagingSenderId: "126805268042",
  appId: "1:126805268042:web:b9362d66697722ccf638b3"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let db;
try { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch(_){ db = getFirestore(app); }
const OPS = collection(db, 'operations');

const CATS = ['خاصة','وسطى','كبرى','فوق الكبرى'];
const ROLES = { admin:'المدير', reception:'الاستعلامات', accounts:'الحسابات', doctor:'طبيب', supervisor:'مسؤول العمليات' };
const OFF = 3 * 3600e3; // توقيت بغداد UTC+3

const S = { user:null, profile:null, ops:[], pending:[], mine:[], repRows:[], users:[], tab:null, subs:[], live:{}, settingUp:false, repKey:'', repLoading:false, mineMonth:'', mineLoading:false,
  rep:{ period:'day', anchor:null, doctor:'all', scope:'all' }, listFilter:'today', q:'' };

/* ---------------- helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => ($(id)?.value ?? '').trim();
function today(){ return new Date(Date.now() + OFF).toISOString().slice(0,10); }
function dayStartMs(str){ const [y,m,d] = str.split('-').map(Number); return Date.UTC(y, m-1, d) - OFF; }
function addDays(str, n){ const [y,m,d] = str.split('-').map(Number); return new Date(Date.UTC(y, m-1, d+n)).toISOString().slice(0,10); }
function fmtDate(str){ if(!str) return '—'; const [y,m,d] = str.split('-'); return `${d}/${m}/${y}`; }
function tsMs(ts){ return ts?.toMillis ? ts.toMillis() : Date.now(); }
function fmtTime(ts){
  const d = new Date(tsMs(ts) + OFF);
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getUTCDate())}/${p(d.getUTCMonth()+1)}/${d.getUTCFullYear()} — ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
}
function dayOf(ts){ return new Date(tsMs(ts) + OFF).toISOString().slice(0,10); }
function sev(cat){
  const k = CATS.indexOf(cat);
  if(k < 0) return '';
  return `<span class="sev k${k}"><i><span></span><span></span><span></span><span></span></i>${esc(cat)}</span>`;
}
let toastT;
function toast(msg, err=false){
  const t = $('toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 3200);
}
function openModal(html){ $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal(){ $('modal').classList.add('hidden'); $('modalBox').innerHTML = ''; }
$('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });
function busy(btn, on, text){ if(!btn) return; btn.disabled = on; if(on){ btn.dataset.t = btn.textContent; btn.textContent = text || 'جارِ الحفظ…'; } else if(btn.dataset.t){ btn.textContent = btn.dataset.t; } }
function errMsg(e){
  const c = e?.code || '';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'الإيميل أو كلمة المرور غير صحيحة';
  if(c.includes('email-already-in-use')) return 'هذا الإيميل مستخدم مسبقاً';
  if(c.includes('weak-password')) return 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
  if(c.includes('invalid-email')) return 'صيغة الإيميل غير صحيحة';
  if(c.includes('permission-denied')) return 'ليس لديك صلاحية لهذه العملية';
  if(c.includes('network') || c.includes('unavailable')) return 'لا يوجد اتصال بالإنترنت، حاول مرة ثانية';
  if(c.includes('too-many-requests')) return 'محاولات كثيرة، انتظر قليلاً ثم حاول';
  return 'حدث خطأ: ' + (e?.message || c || 'غير معروف');
}
window.addEventListener('error', e => toast('خطأ: ' + e.message, true));
window.addEventListener('unhandledrejection', e => toast(errMsg(e.reason), true));

const ECG = `<svg viewBox="0 0 160 36" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h52l6-10 8 22 9-30 7 18h76"/></svg>`;

/* ---------------- auth screens ---------------- */
function renderLogin(){
  $('app').innerHTML = `
  <div class="auth">
    <div class="brand"><h1>عملية</h1>${ECG}<p>نظام تسجيل العمليات الجراحية ومتابعتها</p></div>
    <div class="auth-card">
      <h2>تسجيل الدخول</h2>
      <div class="field"><label>الإيميل</label><input id="lEmail" type="email" class="ltr" autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label><input id="lPass" type="password" class="ltr" autocomplete="current-password"></div>
      <button class="btn block" id="lBtn" onclick="doLogin()">دخول</button>
      <div style="text-align:center;margin-top:8px"><button class="link" onclick="forgot()">نسيت كلمة المرور</button></div>
    </div>
  </div>`;
  $('lPass').addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
}
async function doLogin(){
  const email = val('lEmail'), pass = $('lPass').value;
  if(!email || !pass) return toast('اكتب الإيميل وكلمة المرور', true);
  const b = $('lBtn'); busy(b, true, 'جارِ الدخول…');
  S.unlocked = true;
  try { await signInWithEmailAndPassword(auth, email, pass); }
  catch(e){ toast(errMsg(e), true); busy(b, false); }
}
async function forgot(){
  const email = val('lEmail');
  if(!email) return toast('اكتب إيميلك بالخانة أولاً ثم اضغط نسيت كلمة المرور', true);
  try { await sendPasswordResetEmail(auth, email); toast('أُرسل رابط تغيير كلمة المرور إلى إيميلك'); }
  catch(e){ toast(errMsg(e), true); }
}
function renderSetup(){
  $('app').innerHTML = `
  <div class="auth">
    <div class="brand"><h1>عملية</h1>${ECG}<p>إنشاء حساب مدير النظام. هذه الخطوة تُنفَّذ مرة واحدة فقط.</p></div>
    <div class="auth-card">
      <h2>حساب المدير</h2>
      <div class="field"><label>الاسم</label><input id="sName"></div>
      <div class="field"><label>الإيميل</label><input id="sEmail" type="email" class="ltr"></div>
      <div class="field"><label>كلمة المرور (6 أحرف على الأقل)</label><input id="sPass" type="password" class="ltr" autocomplete="new-password"></div>
      <button class="btn block" id="sBtn" onclick="doSetup()">إنشاء حساب المدير</button>
      <button class="link" onclick="renderLogin()">رجوع لتسجيل الدخول</button>
    </div>
  </div>`;
}
async function doSetup(){
  const name = val('sName'), email = val('sEmail'), pass = $('sPass').value;
  if(!name || !email || !pass) return toast('املأ كل الخانات', true);
  const b = $('sBtn'); busy(b, true, 'جارِ الإنشاء…');
  S.settingUp = true; S.unlocked = true;
  let cred;
  try {
    cred = await createUserWithEmailAndPassword(auth, email, pass);
    const batch = writeBatch(db);
    batch.set(doc(db, 'config', 'setup'), { adminUid: cred.user.uid, createdAt: serverTimestamp() });
    batch.set(doc(db, 'users', cred.user.uid), { name, email, role: 'admin', createdAt: serverTimestamp() });
    await batch.commit();
    S.settingUp = false;
    toast('تم إنشاء حساب المدير');
    await loadProfile(cred.user);
  } catch(e){
    S.settingUp = false;
    if(cred){ try { await cred.user.delete(); } catch(_){} toast('النظام مُعدّ مسبقاً. ادخل بحسابك من شاشة تسجيل الدخول', true); }
    else toast(errMsg(e), true);
    busy(b, false);
    try { await signOut(auth); } catch(_){}
  }
}
function renderNoAccess(){
  $('app').innerHTML = `<div class="auth"><div class="brand"><h1>عملية</h1>${ECG}</div>
  <div class="auth-card"><h2>الحساب غير مفعّل</h2><p class="sub">هذا الإيميل ليس له صلاحية في النظام. اطلب من مدير النظام تفعيله.</p>
  <button class="btn block" onclick="logout()">خروج</button></div></div>`;
}

/* ---------------- session ---------------- */
function clearSubs(){
  S.subs.forEach(f => { try{ f(); }catch(_){} }); S.subs = [];
  Object.values(S.live).forEach(f => { try{ f(); }catch(_){} }); S.live = {};
  S.ops = []; S.pending = []; S.mine = []; S.repRows = []; S.users = []; S.repKey = ''; S.mineMonth = '';
}
async function logout(){ clearSubs(); closeModal(); S.unlocked = false; await signOut(auth); }

onAuthStateChanged(auth, async u => {
  if(S.settingUp) return;
  clearSubs();
  if(!u){ S.user = null; S.profile = null; S.unlocked = false; if(location.hash === '#setup') renderSetup(); else renderLogin(); return; }
  if(!S.unlocked && bioEnabledFor(u.uid)){ renderLock(u); return; }
  S.unlocked = true;
  await loadProfile(u);
});

/* ---------------- Face ID / fingerprint (device lock) ---------------- */
const FACE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 9.5v1M15 9.5v1M12 9.5v3.5h-1"/><path d="M9 15.5c1.6 1.3 4.4 1.3 6 0"/></svg>`;
const bioKey = uid => 'amaliya-bio-' + uid;
function bioEnabledFor(uid){ try { return !!localStorage.getItem(bioKey(uid)); } catch(_){ return false; } }
const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
async function bioAvailable(){
  try { return !!window.PublicKeyCredential && window.isSecureContext && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
  catch(_){ return false; }
}
async function enableBio(){
  try {
    const uid = S.user.uid;
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp: { name: 'عملية' },
      user: { id: new TextEncoder().encode(uid), name: S.user.email || uid, displayName: S.profile.name || 'مستخدم' },
      pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
      authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged' },
      timeout: 60000, attestation: 'none'
    }});
    localStorage.setItem(bioKey(uid), b64u(cred.rawId));
    closeModal(); if($('bioTip')) $('bioTip').innerHTML = '';
    toast('تم تفعيل الدخول بالبصمة / الوجه على هذا الجهاز');
  } catch(e){
    toast(e?.name === 'NotAllowedError' ? 'تم إلغاء التفعيل' : 'هذا الجهاز لا يدعم البصمة أو الوجه', true);
  }
}
function disableBio(){
  try { localStorage.removeItem(bioKey(S.user.uid)); } catch(_){}
  closeModal(); toast('تم إيقاف الدخول بالبصمة على هذا الجهاز');
}
function dismissTip(){ try { localStorage.setItem('amaliya-bio-tip-' + S.user.uid, '1'); } catch(_){} $('bioTip').innerHTML = ''; }
async function showBioTip(){
  const box = $('bioTip'); if(!box || !S.user) return;
  let dismissed = false; try { dismissed = !!localStorage.getItem('amaliya-bio-tip-' + S.user.uid); } catch(_){}
  if(dismissed || bioEnabledFor(S.user.uid) || !(await bioAvailable())){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="tip"><span class="tip-ico">${FACE}</span><div><b>ادخل أسرع بالبصمة أو الوجه</b><small>فعّلها مرة واحدة على هذا الجهاز</small></div>
    <button class="btn sm" onclick="enableBio()">تفعيل</button><button class="x" aria-label="إغلاق" onclick="dismissTip()">×</button></div>`;
}
function renderLock(u){
  $('app').innerHTML = `
  <div class="auth">
    <div class="brand"><h1>عملية</h1>${ECG}</div>
    <div class="auth-card lock">
      <div class="lock-ico">${FACE}</div>
      <h2 style="margin-bottom:4px">مرحباً بعودتك</h2>
      <p class="sub ltr" style="text-align:center">${esc(u.email)}</p>
      <button class="btn block" id="bBtn" onclick="unlockBio()">الدخول بالبصمة / الوجه</button>
      <button class="link" onclick="usePassword()">الدخول بكلمة المرور</button>
    </div>
  </div>`;
}
async function unlockBio(){
  const u = auth.currentUser; if(!u){ renderLogin(); return; }
  const b = $('bBtn'); busy(b, true, 'جارِ التحقق…');
  try {
    const id = localStorage.getItem(bioKey(u.uid));
    await navigator.credentials.get({ publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      allowCredentials: [{ type:'public-key', id: unb64u(id) }],
      userVerification: 'required', timeout: 60000
    }});
    S.unlocked = true;
    await loadProfile(u);
  } catch(e){
    busy(b, false);
    toast('لم يتم التحقق. حاول مرة ثانية أو ادخل بكلمة المرور', true);
  }
}
async function usePassword(){ S.unlocked = false; await signOut(auth); }
async function openAccount(){
  const p = S.profile, ok = await bioAvailable(), on = bioEnabledFor(S.user.uid);
  openModal(`<div class="modal-head"><h3>حسابي</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="patient"><div class="av">${esc(initial(p.name))}</div><div style="min-width:0"><b>${esc(p.name)}</b>
      <div class="op-sub">${esc(roleText())}</div><div class="op-sub ltr" style="text-align:right">${esc(S.user.email)}</div></div></div>
    <div class="set-row"><div><b>الدخول بالبصمة / الوجه</b><small>${ok ? (on ? 'مفعّل على هذا الجهاز' : 'افتح النظام ببصمتك أو وجهك بدل كلمة المرور') : 'هذا الجهاز أو المتصفح لا يدعمها'}</small></div>
      ${ok ? (on ? '<button class="btn ghost sm" onclick="disableBio()">إيقاف</button>' : '<button class="btn sm" onclick="enableBio()">تفعيل</button>') : ''}</div>
    <button class="btn danger block" style="margin-top:16px" onclick="logout()">تسجيل الخروج</button>`);
}
const initial = n => String(n || '?').replace(/^د\.?\s*/, '').trim().charAt(0) || '?';
function roleText(){ const p = S.profile; return p.role === 'admin' ? 'المدير — طبيب عمليات' : (isChief() ? 'طبيب — يرى كل العمليات' : ROLES[p.role]); }

async function loadProfile(u){
  S.user = u;
  $('app').innerHTML = '<div class="loading">جارِ التحميل…</div>';
  try {
    const snap = await getDoc(doc(db, 'users', u.uid));
    if(!snap.exists()){ renderNoAccess(); return; }
    S.profile = { id: u.uid, ...snap.data() };
    S.rep = { period:'day', anchor: today(), doctor:'all', scope:'all' };
    startRole();
  } catch(e){ toast(errMsg(e), true); renderNoAccess(); }
}

const isChief = () => S.profile?.role === 'admin' || (S.profile?.role === 'doctor' && S.profile?.seeAll === true);
const isDocLike = () => ['doctor','admin'].includes(S.profile?.role);
const mapSnap = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
let errShown = 0;
async function onErr(e){
  if(String(e?.code || '').includes('permission-denied') && S.user){
    try { const snap = await getDoc(doc(db, 'users', S.user.uid)); if(!snap.exists()){ clearSubs(); renderNoAccess(); return; } } catch(_){}
  }
  if(Date.now() - errShown > 4000){ errShown = Date.now(); toast(errMsg(e), true); }
}
function live(key, q, cb){
  if(S.live[key]) { try { S.live[key](); } catch(_){} }
  S.live[key] = onSnapshot(q, s => cb(mapSnap(s)), onErr);
}
/* saves never freeze the button when the network drops: writes are queued and sent automatically */
async function commit(p){
  if(navigator.onLine === false){ p.catch(e => toast(errMsg(e), true)); return 'queued'; }
  await p; return 'ok';
}
function monthOf(d){ return d.slice(0,7); }
function monthsBetween(from, to){
  const out = []; let [y,m] = from.split('-').map(Number); const [ty,tm] = to.split('-').map(Number);
  while((y < ty || (y === ty && m <= tm)) && out.length < 30){ out.push(`${y}-${String(m).padStart(2,'0')}`); m++; if(m > 12){ m = 1; y++; } }
  return out;
}
const AR_MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const monthLabel = m => { const [y,mm] = m.split('-').map(Number); return `${AR_MONTHS[mm-1]} ${y}`; };
function shiftMonth(m, n){ let [y,mm] = m.split('-').map(Number); mm += n; while(mm > 12){ mm -= 12; y++; } while(mm < 1){ mm += 12; y--; } return `${y}-${String(mm).padStart(2,'0')}`; }

/* ---- range-limited live data: keeps reads small no matter how many years of data accumulate ---- */
function subPending(){
  live('pending', query(OPS, where('status','==','pending')), rows => {
    S.pending = rows.sort((a,b) => tsMs(b.createdAt) - tsMs(a.createdAt)); renderShellCounts();
    if(['pending','new'].includes(S.tab)) renderView();
  });
}
function subReports(){
  const [from, to] = rangeOf(), mo = (S.profile.role === 'doctor' && !isChief()) || (isChief() && S.rep.scope === 'mine');
  const key = `${from}|${to}|${mo}`; if(S.repKey === key) return;
  S.repKey = key; S.repRows = []; S.repLoading = true;
  const q = mo ? query(OPS, where('doctorUid','==',S.user.uid), where('opMonth','in', monthsBetween(from, to)))
               : query(OPS, where('opDate','>=',from), where('opDate','<=',to));
  live('rep', q, rows => {
    S.repRows = rows.filter(o => o.status === 'done' && o.opDate >= from && o.opDate <= to); S.repLoading = false;
    if(S.tab === 'reports') renderView();
  });
}
function subMine(){
  if(!S.mineMonth) S.mineMonth = monthOf(today());
  const m = S.mineMonth; S.mine = []; S.mineLoading = true;
  live('mine', query(OPS, where('doctorUid','==',S.user.uid), where('opMonth','==',m)), rows => {
    if(m !== S.mineMonth) return;
    S.mine = rows.filter(o => o.status === 'done'); S.mineLoading = false;
    if(S.tab === 'mine') renderView();
  });
}
function setMineMonth(n){ S.mineMonth = shiftMonth(S.mineMonth || monthOf(today()), n); subMine(); renderView(); }
/* one-time: older operations get the month key used by the fast queries */
async function migrateMonths(){
  const k = 'amaliya-mig1-' + S.user.uid;
  try { if(localStorage.getItem(k)) return; } catch(_){ return; }
  try {
    const snap = await getDocs(query(OPS, where('doctorUid','==',S.user.uid)));
    const todo = snap.docs.filter(d => { const x = d.data(); return x.status === 'done' && x.opDate && !x.opMonth; });
    for(const d of todo){ await updateDoc(d.ref, { opMonth: monthOf(d.data().opDate) }); }
    localStorage.setItem(k, '1');
  } catch(_){}
}

function startRole(){
  const r = S.profile.role, uid = S.user.uid;
  if(r === 'reception'){
    S.tab = 'new';
    live('rec', query(OPS, where('createdAt','>=', Timestamp.fromMillis(Date.now() - 6 * 864e5))), rows => {
      S.ops = rows.sort((a,b) => tsMs(b.createdAt) - tsMs(a.createdAt)); renderView();
    });
  } else if(r === 'supervisor'){
    S.tab = 'today';
    subscribeToday();
    let cur = today();
    const iv = setInterval(() => { if(today() !== cur){ cur = today(); subscribeToday(); } }, 60000);
    S.subs.push(() => clearInterval(iv));
  } else {
    S.tab = (r === 'doctor' || r === 'admin') ? 'pending' : 'reports';
    subPending();
    if(isDocLike()) migrateMonths();
    if(r === 'admin') live('users', collection(db, 'users'), rows => { S.users = rows; if(S.tab === 'users') renderView(); });
  }
  renderShell();
}

let todayUnsub = null;
function subscribeToday(){
  if(todayUnsub){ todayUnsub(); }
  const start = dayStartMs(today());
  todayUnsub = onSnapshot(query(OPS, where('dayTs','>=',Timestamp.fromMillis(start)), where('dayTs','<',Timestamp.fromMillis(start + 864e5))), s => {
    S.ops = mapSnap(s); renderView();
  }, onErr);
  if(!S.subs.includes(stopToday)) S.subs.push(stopToday);
}
function stopToday(){ if(todayUnsub){ todayUnsub(); todayUnsub = null; } }

function tabsFor(){
  const r = S.profile.role;
  if(r === 'reception') return [['new','تسجيل مريض'],['list','سجلاتي']];
  if(r === 'doctor') return [['pending','بالانتظار'],['mine','عملياتي'],['reports','التقارير']];
  if(r === 'supervisor') return [['today','عمليات اليوم']];
  if(r === 'accounts') return [['reports','التقارير'],['pending','قيد الانتظار']];
  return [['pending','بالانتظار'],['mine','عملياتي'],['reports','التقارير'],['users','الحسابات']];

function renderView(){
  const v = $('view'); if(!v) return;
  const t = S.tab;
  if(t === 'new') v.innerHTML = viewNew();
  else if(t === 'list') v.innerHTML = viewReceptionList();
  else if(t === 'pending') v.innerHTML = viewPending();
  else if(t === 'mine'){ if(!S.live.mine) subMine(); v.innerHTML = viewMine(); }
  else if(t === 'reports'){ subReports(); v.innerHTML = viewReports(); }
  else if(t === 'today') v.innerHTML = viewToday();
  else if(t === 'users') v.innerHTML = viewUsers();

/* ---------------- data table engine ---------------- */
const TBL = {};
function dtDefine(id, cfg){
  const p = TBL[id] || {};
  TBL[id] = { ...cfg, q: p.q || '', sk: p.sk ?? cfg.sk, dir: p.dir ?? (cfg.dir ?? -1) };
}
function dtShell(id, title){
  if(TBL[id]) TBL[id].title = title;
  return `<section class="dt"><div class="dt-head"><div class="dt-title">${title}<span class="dt-count" id="${id}-c">0</span></div>
    <div class="dt-tools no-print"><input class="dt-search" placeholder="بحث بالاسم أو الطبلة…" value="${esc(TBL[id]?.q || '')}" oninput="dtSearch('${id}',this.value)">
    <button class="btn ghost sm" onclick="openPrint('${id}')" aria-label="طباعة">${PRINT_ICO}<span>طباعة</span></button></div></div>
    <div class="dt-hint hidden no-print" id="${id}-h">↔ اسحب الجدول لرؤية كل التفاصيل</div>
    <div class="dt-scroll" id="${id}-b"></div></section>`;
}
function dtRows(id){
  const t = TBL[id]; if(!t) return [];
  let rows = t.rows();
  const q = t.q.trim();
  if(q) rows = rows.filter(o => [o.patientName, o.tableNo, o.opName, o.doctorName, o.age, o.anesthetist].some(x => String(x ?? '').includes(q)));
  const col = t.cols.find(c => c.k === t.sk);
  if(col){
    const f = col.s || col.v;
    rows = rows.slice().sort((a,b) => {
      const x = f(a) ?? '', y = f(b) ?? '';
      const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'ar', { numeric:true });
      return r * t.dir;
    });
  }
  return rows;
}
function dtFill(id){
  const t = TBL[id], box = $(id + '-b'); if(!t || !box) return;
  let rows = t.rows();
  const q = t.q.trim();
  if(q) rows = rows.filter(o => [o.patientName, o.tableNo, o.opName, o.doctorName, o.age, o.anesthetist].some(x => String(x ?? '').includes(q)));
  const col = t.cols.find(c => c.k === t.sk);
  if(col){
    const f = col.s || col.v;
    rows = rows.slice().sort((a,b) => {
      const x = f(a) ?? '', y = f(b) ?? '';
      const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x).localeCompare(String(y), 'ar', { numeric:true });
      return r * t.dir;
    });
  }
  $(id + '-c').textContent = rows.length;
  if(!rows.length){
    box.innerHTML = `<div class="dt-empty"><b>${q ? 'لا توجد نتائج' : (t.empty || 'لا توجد بيانات')}</b>${q ? 'جرّب كلمة بحث ثانية' : (t.emptySub || '')}</div>`;
    return;
  }
  box.innerHTML = `<table><thead><tr>${t.cols.map(c => {
      const on = t.sk === c.k;
      return `<th class="${c.stick ? 'stick' : ''} ${c.nos ? '' : 'srt'} ${on ? 'on' : ''}" ${c.nos ? '' : `onclick="dtSort('${id}','${c.k}')"`}>${c.l}${on ? `<span class="arr">${t.dir > 0 ? '↑' : '↓'}</span>` : ''}</th>`;
    }).join('')}</tr></thead>
    <tbody>${rows.map((o,i) => `<tr onclick="openDetail('${o.id}')">${t.cols.map(c =>
      `<td class="${c.stick ? 'stick' : ''} ${c.cls || ''}">${c.h ? c.h(o,i) : (esc(c.v(o)) || '<span class="na">—</span>')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  const hint = $(id + '-h');
  if(hint) hint.classList.toggle('hidden', box.scrollWidth <= box.clientWidth + 4);
}

function colW(set){
  const cols = PSETS[set].map(k => ({ k, ...PC[k] }));
  if(set === 'today'){ cols.find(c => c.k === 'notes').w = 6.5; }
  if(set === 'basic'){ const w = { n:5, tableNo:10, patient:27, age:8, status:15, doc:17, reg:18 }; cols.forEach(c => c.w = w[c.k]); }
  return cols;
}
const PS_FIRST = 10, PS_NEXT = 13;
let psState = null;
function openPrint(id){
  const t = TBL[id]; if(!t) return;
  const rows = dtRows(id);
  if(!rows.length) return toast('لا توجد بيانات للطباعة', true);
  const cols = colW(t.pset || 'full');
  const chunks = [rows.slice(0, PS_FIRST)];
  for(let i = PS_FIRST; i < rows.length; i += PS_NEXT) chunks.push(rows.slice(i, i + PS_NEXT));
  const title = t.ptitle || t.title || 'تقرير';
  const ctx = t.ctx || '';
  const done = rows.filter(o => o.status === 'done');
  const counts = CATS.map(c => done.filter(o => o.category === c).length);
  const byDoc = {};
  done.forEach(o => { const d = o.doctorName || '—'; byDoc[d] = (byDoc[d] || 0) + 1; });
  const docs = Object.entries(byDoc).sort((a,b) => b[1] - a[1]);
  const printedAt = fmtTime();
  const summary = `<div class="ps-sum">
      <div class="ps-tot"><b>${rows.length}</b><span>${t.pset === 'basic' ? 'مريض' : 'عملية'}</span></div>
      ${done.length ? CATS.map((c,i) => `<div class="ps-k k${i}"><b>${counts[i]}</b><span>${c}</span></div>`).join('') : ''}
      ${docs.length > 1 ? `<div class="ps-docs">${docs.map(([d,n]) => `<span>${esc(d)} <b>${n}</b></span>`).join('')}</div>` : ''}
    </div>`;
  let idx = 0;
  const pages = chunks.map((chunk, pi) => {
    const last = pi === chunks.length - 1;
    const body = chunk.map(o => { const i = idx++; return `<tr>${cols.map(c => `<td><div>${c.f(o, i) || '<span class="na">—</span>'}</div></td>`).join('')}</tr>`; }).join('');
    return `<section class="ps-page">
      <header class="ps-head">
        <div class="ps-brand"><img class="ps-logo" alt="" src="${APP_ICON}"><div><b>عملية</b><small>نظام العمليات الجراحية</small></div></div>
        <div class="ps-title"><b>${esc(title)}</b><small>${esc(ctx)}</small></div>
        <div class="ps-meta"><small>طُبع: ${printedAt}</small><small>بواسطة: ${esc(S.profile.name)}</small><small>صفحة ${pi + 1} من ${chunks.length}</small></div>
      </header>
      ${pi === 0 ? summary : ''}
      <table class="ps-t"><colgroup>${cols.map(c => `<col style="width:${c.w}%">`).join('')}</colgroup>
        <thead><tr>${cols.map(c => `<th>${c.l}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>
      <footer class="ps-foot">
        ${last ? '<div class="ps-sign"><span>توقيع الطبيب المختص: ..........................</span><span>توقيع مسؤول العمليات: ..........................</span><span>الختم</span></div>' : '<div></div>'}
        <small>عملية · مستند داخلي سرّي</small>
      </footer>
    </section>`;
  }).join('');
  psState = { title, blob: null };
  $('psTitle').textContent = title;
  $('psDoc').innerHTML = pages;
  const pb = $('psPdf'); pb.disabled = false; pb.innerHTML = `${PDF_ICO}<span>حفظ PDF</span>`; pb.onclick = makePdf;
  document.body.classList.add('ps-open');
  $('printSheet').classList.remove('hidden');
  $('printSheet').scrollTop = 0;
  fitPreview();
}
function fitPreview(){
  const doc = $('psDoc'); if(!doc || $('printSheet').classList.contains('hidden')) return;

  doc.style.transform = `scale(${sc})`;
  $('psWrap').style.height = (doc.scrollHeight * sc) + 'px';
  $('psWrap').style.width = (1123 * sc) + 'px';
}

const libCache = {};
function loadScript(src){
  return libCache[src] || (libCache[src] = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = src; sc.onload = res;
    sc.onerror = () => { delete libCache[src]; rej(new Error('load')); }; document.head.appendChild(sc);
  }));
}
const PDF_ICO = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 12v6M9 15l3 3 3-3"/></svg>`;
async function makePdf(){
  const pb = $('psPdf'); pb.disabled = true; pb.innerHTML = '<span>جارِ تجهيز الملف…</span>';
  let holder;
  try {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    if(document.fonts?.ready) await document.fonts.ready;
    holder = document.createElement('div'); holder.className = 'ps-capture';
    holder.innerHTML = $('psDoc').innerHTML; document.body.appendChild(holder);
    const pdf = new window.jspdf.jsPDF({ orientation:'landscape', unit:'pt', format:'a4', compress:true });
    const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
    const pages = holder.querySelectorAll('.ps-page');
    for(let i = 0; i < pages.length; i++){
      pb.innerHTML = `<span>صفحة ${i + 1} من ${pages.length}…</span>`;
      const cv = await window.html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', logging: false, useCORS: true });
      if(i) pdf.addPage('a4', 'landscape');
      pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, H);
    }
    psState.blob = pdf.output('blob');
    pb.disabled = false; pb.innerHTML = `${PDF_ICO}<span>الملف جاهز — اضغط للمشاركة / الحفظ</span>`; pb.onclick = sharePdf;
    pb.classList.add('ready');
  } catch(e){
    pb.disabled = false; pb.innerHTML = `${PDF_ICO}<span>حفظ PDF</span>`;
    toast(e?.message === 'load' ? 'تحتاج اتصال إنترنت لتجهيز ملف PDF' : 'تعذّر تجهيز الملف، حاول مرة ثانية', true);
  } finally { holder?.remove(); }
}
async function sharePdf(){
  if(!psState?.blob) return;
  const name = `عملية - ${psState.title} - ${today()}.pdf`;
  const file = new File([psState.blob], name, { type:'application/pdf' });
  try {
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title: psState.title }); return; }
  } catch(e){ if(e?.name === 'AbortError') return; }
  const url = URL.createObjectURL(psState.blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function openDetail(id){
  const o = findOp(id); if(!o) return;
  const done = o.status === 'done';
  const r = S.profile.role, uid = S.user.uid;
  let actions = '';
  if(isDocLike() && (!done || o.doctorUid === uid)) actions += `<button class="btn" onclick="openOpForm('${o.id}')">${done ? 'تعديل العملية' : 'إكمال بيانات العملية'}</button>`;
  if(r === 'reception' && !done && o.createdBy === uid) actions += `<button class="btn ghost" onclick="editReception('${o.id}')">تعديل بيانات المريض</button>`;
  if(r === 'admin') actions += `<button class="btn danger" onclick="delOp('${o.id}')">حذف</button>`;

async function saveNew(){
  const tableNo = val('nTable'), patientName = val('nName'), age = val('nAge');
  if(!patientName || !tableNo || !age) return toast('اكتب اسم المريض ورقم الطبلة والعمر', true);
  const dup = S.ops.find(o => o.tableNo === tableNo && o.status === 'pending');
  if(dup && !confirm(`رقم الطبلة ${tableNo} مسجّل مسبقاً للمريض "${dup.patientName}" وما زال بالانتظار. تحويله مرة ثانية؟`)) return;
  const b = $('nBtn'); busy(b, true, 'جارِ التحويل…');
  try {
    const r = await commit(addDoc(OPS, { tableNo, patientName, age, status:'pending', createdBy:S.user.uid, createdAt:serverTimestamp(), dayTs:serverTimestamp(), receptionName:S.profile.name || '' }));
    toast(r === 'queued' ? 'لا يوجد إنترنت — حُفظ وسيُرسل تلقائياً عند عودة الاتصال' : 'تم التحويل إلى الأطباء');

  } catch(e){ toast(errMsg(e), true); }
  busy(b, false);
}

      <div class="field"><label>مساعد الجراحة</label><input id="fSA" maxlength="120" value="${f('surgeryAssistant')}"></div>
    </div>
    <div class="field"><label>الملاحظات</label><textarea id="fNotes" maxlength="1500">${f('notes')}</textarea></div>
    <button class="btn block" id="fBtn" onclick="saveOp('${o.id}')">حفظ العملية</button>`);
}
async function saveOp(id){
  const opName = val('fOp'), opDate = val('fDate'), category = val('fCat');
  if(!opName) return toast('اكتب اسم العملية', true);
  if(!opDate) return toast('اختر تاريخ العملية', true);
  if(!CATS.includes(category)) return toast('اختر تصنيف العملية', true);
  const b = $('fBtn'); busy(b, true);
  try {
    const r = await commit(updateDoc(doc(db,'operations',id), {
      doctorUid: S.user.uid, doctorName: S.profile.name || '',
      opName, opDate, opMonth: monthOf(opDate), category,
      dayTs: Timestamp.fromMillis(dayStartMs(opDate)),
      anesthetist: val('fAn'), anesthesiaAssistant: val('fAnA'), surgeryAssistant: val('fSA'),
      notes: val('fNotes'), status: 'done', updatedAt: serverTimestamp()
    }));
    closeModal(); toast(r === 'queued' ? 'لا يوجد إنترنت — حُفظت وستُرسل تلقائياً عند عودة الاتصال' : 'تم حفظ العملية');
  } catch(e){
    toast(e?.code?.includes('permission-denied') ? 'هذه العملية سجّلها طبيب آخر قبلك' : errMsg(e), true);
    busy(b, false);
  }
}

/* ---------------- reports ---------------- */
function rangeOf(){
  const a = S.rep.anchor || today(), p = S.rep.period;
  if(p === 'day') return [a, a, 'يوم ' + fmtDate(a)];
  if(p === 'week'){
    const [y,m,d] = a.split('-').map(Number);
    const dow = new Date(Date.UTC(y, m-1, d)).getUTCDay();
    const from = addDays(a, -((dow + 1) % 7)), to = addDays(from, 6);
    return [from, to, `الأسبوع ${fmtDate(from)} — ${fmtDate(to)}`];
  }
  if(p === 'month'){
    const [y,m] = a.split('-').map(Number);
    const from = `${y}-${String(m).padStart(2,'0')}-01`;
    const to = new Date(Date.UTC(y, m, 0)).toISOString().slice(0,10);
    return [from, to, `شهر ${m} / ${y}`];
  }
  const y = a.slice(0,4);
  return [`${y}-01-01`, `${y}-12-31`, `سنة ${y}`];
}
function repCtx(){
  const canAll = !isDocLike() || isChief();
  const showDocFilter = canAll && !(isChief() && S.rep.scope === 'mine');
  return { canAll, showDocFilter };
}
function reportSource(){ return S.repRows; }
function reportRows(){
  const [from, to] = rangeOf(), { showDocFilter } = repCtx();
  let list = reportSource().filter(o => o.opDate >= from && o.opDate <= to);
  if(showDocFilter && S.rep.doctor !== 'all') list = list.filter(o => o.doctorName === S.rep.doctor);
  return list;
}
function viewReports(){
  const [, , label] = rangeOf(), { canAll, showDocFilter } = repCtx();
  const list = reportRows();
  const doctors = [...new Set([...S.repRows.map(o => o.doctorName), S.rep.doctor].filter(d => d && d !== 'all'))].sort();
  const counts = CATS.map(c => list.filter(o => o.category === c).length);
  const byDoc = {};
  list.forEach(o => { byDoc[o.doctorName || '—'] = (byDoc[o.doctorName || '—'] || 0) + 1; });
  const P = [['day','يومي'],['week','أسبوعي'],['month','شهري'],['year','سنوي']];
  const who = isChief() && S.rep.scope === 'mine' ? 'عملياتي' : (canAll ? (S.rep.doctor === 'all' ? 'كل الأطباء' : S.rep.doctor) : 'عملياتي');
  const cols = canAll && !(isChief() && S.rep.scope === 'mine') ? FULL : FULL.filter(c => c !== C.doc);
  dtDefine('tRep', { rows: reportRows, cols, sk:'opDate', dir:1, empty:'لا توجد عمليات بهذه الفترة', emptySub:'غيّر التاريخ أو نوع التقرير' });
  TBL.tRep.empty = S.repLoading ? 'جارِ التحميل…' : 'لا توجد عمليات بهذه الفترة'; TBL.tRep.emptySub = S.repLoading ? '' : 'غيّر التاريخ أو نوع التقرير';
  TBL.tRep.cols = cols; TBL.tRep.ctx = `${label} · ${who}`; TBL.tRep.pset = 'full'; TBL.tRep.ptitle = 'تقرير العمليات';
  return `
  <div class="no-print rep-controls">
    <div class="seg">${P.map(([k,l]) => `<button class="${S.rep.period === k ? 'on' : ''}" onclick="setRep('period','${k}')">${l}</button>`).join('')}</div>
    <div class="row2">
      <div class="field"><label>التاريخ</label><input type="date" value="${esc(S.rep.anchor)}" onchange="setRep('anchor',this.value||'${today()}')"></div>
      ${isChief() ? `<div class="field"><label>العرض</label><select onchange="setRep('scope',this.value)">
          <option value="all" ${S.rep.scope === 'all' ? 'selected' : ''}>كل الأطباء</option>
          <option value="mine" ${S.rep.scope === 'mine' ? 'selected' : ''}>عملياتي فقط</option></select></div>`
        : (showDocFilter ? docSelect(doctors) : '<div></div>')}
    </div>
    ${isChief() && showDocFilter ? docSelect(doctors) : ''}
  </div>
  <div class="hero print-also">
    <div><div class="hero-l">${esc(label)} · ${esc(who)}</div><div class="total"><b>${list.length}</b><span>عملية</span></div></div>
    ${list.length ? `<button class="btn ghost sm no-print" onclick="openPrint('tRep')">${PRINT_ICO}<span>طباعة التقرير</span></button>` : ''}
  </div>
  <div class="cats print-also">${CATS.map((c,i) => `<div class="k${i}"><b>${counts[i]}</b><small>${c}</small><i style="width:${list.length ? Math.round(counts[i]/list.length*100) : 0}%"></i></div>`).join('')}</div>
  ${canAll && Object.keys(byDoc).length > 1 ? `<div class="panel bydoc no-print"><div class="h" style="font-size:15px;margin-bottom:6px">حسب الطبيب</div>
    ${Object.entries(byDoc).sort((a,b) => b[1]-a[1]).map(([d,n]) => `<div><span>${esc(d)}</span><b>${n}</b></div>`).join('')}</div>` : ''}
  ${dtShell('tRep', 'تفاصيل العمليات')}`;
}
function docSelect(doctors){
  return `<div class="field"><label>الطبيب</label><select onchange="setRep('doctor',this.value)">
    <option value="all">كل الأطباء</option>${doctors.map(d => `<option ${S.rep.doctor === d ? 'selected' : ''}>${esc(d)}</option>`).join('')}</select></div>`;
}
function setRep(k, v){ S.rep[k] = v; renderView(); }

/* ---------------- supervisor: today ---------------- */
function viewToday(){
  const done = S.ops.filter(o => o.status === 'done');
  const counts = CATS.map(c => done.filter(o => o.category === c).length);
  dtDefine('tDay', { rows: () => S.ops, cols: [C.patient, C.age, C.status, C.op, C.cat, C.doc, C.an, C.anA, C.sa, C.notes, C.reg],
    sk:'createdAt', dir:1, empty:'لا توجد عمليات اليوم بعد', emptySub:'تظهر هنا فور تسجيلها', ctx: fmtDate(today()), pset:'today', ptitle:'عمليات اليوم' });
  return `

    <div><div class="hero-l">عمليات اليوم · ${fmtDate(today())}</div>
      <div class="total"><b>${done.length}</b><span>مكتملة · ${S.ops.length - done.length} بانتظار الطبيب</span></div></div>
  </div>
  <p class="sub no-print">تتحدّث تلقائياً. عمليات الأيام السابقة لا تظهر هنا.</p>
  <div class="cats print-also">${CATS.map((c,i) => `<div class="k${i}"><b>${counts[i]}</b><small>${c}</small><i style="width:${done.length ? Math.round(counts[i]/done.length*100) : 0}%"></i></div>`).join('')}</div>
  ${dtShell('tDay', 'جدول اليوم')}`;

/* ---------------- admin: users ---------------- */
const ROLE_OPTS = [['doctor','طبيب عمليات (يرى عملياته فقط)'],['supervisor','مسؤول العمليات (عمليات اليوم فقط)'],['reception','الاستعلامات'],['accounts','الحسابات (مراقبة فقط)'],['admin','مدير (طبيب يرى كل العمليات)']];
function viewUsers(){
  const order = { admin:0, doctor:1, supervisor:2, reception:3, accounts:4 };
  const list = S.users.slice().sort((a,b) => (order[a.role] ?? 9) - (order[b.role] ?? 9));
  return `
  <div class="panel">
    <div class="h">إضافة حساب</div>
    <p class="sub">كل شخص يدخل بإيميله وكلمة المرور اللي تحددها له هنا.</p>
    <div class="field"><label>الاسم</label><input id="uName" placeholder="مثلاً: د. أحمد علي"></div>
    <div class="field"><label>الإيميل</label><input id="uEmail" type="email" class="ltr" autocomplete="off"></div>
    <div class="field"><label>كلمة المرور (6 أحرف على الأقل)</label><input id="uPass" type="text" class="ltr" autocomplete="off"></div>
    <div class="field"><label>القسم</label><select id="uRole">${ROLE_OPTS.map(([v,l]) => `<option value="${v}">${l}</option>`).join('')}</select></div>
    <button class="btn block" id="uBtn" onclick="createStaff()">إنشاء الحساب</button>
  </div>
  <div class="panel">
    <div class="h" style="font-size:17px">الحسابات (${list.length})</div>
    ${list.map(u => `<div class="user">
      <div class="av">${esc((u.name || '?').replace(/^د\.?\s*/,'').charAt(0))}</div>
      <div class="info"><b>${esc(u.name)}</b><small>${esc(u.email)}</small></div>
      <span class="role">${esc(ROLES[u.role] || u.role)}</span>
      ${u.id !== S.user.uid ? `<button class="btn ghost sm" onclick="editUser('${u.id}')">تعديل</button>` : ''}
    </div>`).join('')}
  </div>`;
}
async function createStaff(){
  const name = val('uName'), email = val('uEmail'), pass = $('uPass').value, role = val('uRole');
  if(!name || !email || !pass) return toast('املأ الاسم والإيميل وكلمة المرور', true);
  const b = $('uBtn'); busy(b, true, 'جارِ الإنشاء…');
  try {
    const sec = getApps().find(a => a.name === 'secondary') || initializeApp(firebaseConfig, 'secondary');
    const sAuth = getAuth(sec);
    const cred = await createUserWithEmailAndPassword(sAuth, email, pass);
    await setDoc(doc(db, 'users', cred.user.uid), { name, email, role, seeAll:false, createdAt: serverTimestamp() });
    await signOut(sAuth);
    toast(`تم إنشاء حساب ${name}`);
    ['uName','uEmail','uPass'].forEach(i => $(i).value = '');
  } catch(e){ toast(errMsg(e), true); }
  busy(b, false);
}
function editUser(id){
  const u = S.users.find(x => x.id === id); if(!u) return;
  openModal(`<div class="modal-head"><h3>تعديل الحساب</h3><button class="x" onclick="closeModal()">×</button></div>
    <p class="sub ltr">${esc(u.email)}</p>
    <div class="field"><label>الاسم</label><input id="xName" value="${esc(u.name)}"></div>
    <div class="field"><label>القسم</label><select id="xRole">${ROLE_OPTS.map(([v,l]) => `<option value="${v}" ${u.role === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <button class="btn block" id="xBtn" onclick="saveUser('${u.id}')">حفظ التعديل</button>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
      <button class="btn ghost sm" onclick="resetPass('${u.id}')">إرسال رابط كلمة مرور جديدة</button>
      <button class="btn danger sm" onclick="removeUser('${u.id}')">إيقاف الحساب</button>
    </div>
    <p class="sub" style="margin-top:12px">تغيير اسم الطبيب لا يغيّر الاسم في العمليات المسجّلة سابقاً.</p>`);
}
async function saveUser(id){
  const name = val('xName'), role = val('xRole');
  if(!name) return toast('اكتب الاسم', true);
  const b = $('xBtn'); busy(b, true);
  try { await updateDoc(doc(db,'users',id), { name, role, seeAll:false }); closeModal(); toast('تم حفظ التعديل'); }
  catch(e){ toast(errMsg(e), true); busy(b, false); }
}
async function resetPass(id){
  const email = S.users.find(x => x.id === id)?.email; if(!email) return;
  try { await sendPasswordResetEmail(auth, email); toast('أُرسل الرابط إلى ' + email); }
  catch(e){ toast(errMsg(e), true); }
}
async function removeUser(id){
  const u = S.users.find(x => x.id === id);
  if(!confirm(`إيقاف حساب "${u?.name}"؟ لن يستطيع الدخول للنظام بعدها.`)) return;
  try { await deleteDoc(doc(db,'users',id)); closeModal(); toast('تم إيقاف الحساب'); }
  catch(e){ toast(errMsg(e), true); }
}
async function delOp(id){
  const o = findOp(id);
  if(!confirm(`حذف سجل المريض "${o?.patientName}" نهائياً؟`)) return;
  try { await deleteDoc(doc(db,'operations',id)); closeModal(); toast('تم الحذف'); }
  catch(e){ toast(errMsg(e), true); }
}
